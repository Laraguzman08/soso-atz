<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/logonav.jpg" type="image/jpg">
    <title>ATINY Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
    
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4">
                <div class="card p-4 shadow-lg">
                    <div class="topo-login position-relative mb-4">

                        <h2 class="text-center">
                            Login
                        </h2>

                    </div>

                    <form id="FormLogin">

                        <div class="mb-3">

                            <label class="form-label" style="font-size: 20px;">
                                Nome
                            </label>

                            <input type="text" id="nome" class="form-control" placeholder="Digite seu nome de usuário"
                                style="border: 2px solid #000;">
                            </input>


                        </div>

                        <div class="mb-3">

                            <label class="form-label" style="font-size: 20px;">
                                Senha
                            </label>

                            <input type="password" id="senha" class="form-control" placeholder="Digite sua senha"
                                style="border: 2px solid #000;">
                            </input>


                        </div>

                        <button class="btn btn-primary w-100" type="submit">
                            Entrar
                        </button>

                        <br><br>

                        <button class="btn w-100 shadow" type="button" onclick="esqueceuSenha()">
                            Dica (◕‿◕)
                        </button>

                    </form>

                    <div class="text-danger text-center">
                        <p id="problema"></p>
                    </div>

                    <script src="../scripts/login.js"></script>

                </div>
            </div>
        </div>
    </main>

</body>
</html>
