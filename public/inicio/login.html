<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../assets/logonav.jpg" type="image/jpg">
    <title>ATINY Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/style.css">
</head>

<body>

    <main class="d-flex align-items-center justify-content-center vh-100">
        <div class="container"
            style="max-width: 30%; background-color: rgba(255, 255, 255, 0.8); padding: 2rem; border-radius: 1.6rem">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div>
                        <h2 id="login-title" class="text-center mb-4">
                            Login
                        </h2>
                    </div>

                    <form id="login-form" class="d-flex flex-column gap-3"
                        style="justify-content: center; align-items: center;" onsubmit="return validarLogin()">

                        <div class="form-group">
                            <label for="nome" style="color: #000; font-weight: bold">
                                Username
                            </label>
                            <input type="text" id="nome" class="form-control" placeholder="Enter your username"
                                style="border: 2px solid #000;">
                        </div>

                        <div class="form-group">
                            <label for="senha" style="color: #000; font-weight: bold">
                                Password
                            </label>
                            <input type="password" id="senha" class="form-control mb-4"
                                placeholder="Enter your password" style="border: 2px solid #000;">
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg px-4 button btn-custom"
                            style="width: 120%;">
                            Enter
                        </button>

                        <button type="button" class="btn btn-primary btn-lg px-2 button btn-custom" style="width: 120%;"
                            onclick="dicas()">
                            Hint (◕‿◕)
                        </button>

                        <div id="dicaMenssagem">
                            <button type="button" class="botao-fechar" onclick="fecharDicas()">×</button>
                            <button type="button" onclick="mostrarDica('nome')" class="btn btn-secondary mb-2" 
                            style="width: 100%">
                                Username Hint
                            </button>
                            <button type="button" onclick="mostrarDica('senha')" class="btn btn-secondary" 
                            style="width: 100%">
                                Password Hint
                            </button>
                            <div id="dicaTexto" class="mt-3 text-center"></div>
                        </div>

                        <div id="error-message" style="display: none">
                            <p id="problema" class="text-danger"
                                style="font-weight: bold; text-shadow: 1px 1px 2px #ffacac4d; text-align: center;"></p>
                        </div>

                    </form>

                    <script src="../../scripts/login.js"></script>

                </div>
            </div>
        </div>
    </main>

</body>

</html>
